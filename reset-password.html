<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnkiGen - 重設密碼</title>
  <!-- 引入 Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <!-- 引入 FontAwesome 圖標 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>

<body class="medical-theme">
  <!-- 背景發光特效 -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <header class="app-header">
    <div class="header-container">
      <a class="logo" href="index.html">
        <i class="fa-solid fa-lightbulb"></i>
        <span>AnkiGen <span class="logo-accent">Hub</span></span>
      </a>
      <div class="app-desc">
        <span class="app-slogan">The central hub for instant Anki creation</span>
        <a href="index.html" class="nav-home-link"><i class="fa-solid fa-house"></i> 回首頁</a>
      </div>
    </div>
  </header>

  <main class="wizard-single-col" style="max-width: 460px; margin-top: 60px;">
    <div class="card-panel">
      <div class="panel-header">
        <h2><i class="fa-solid fa-key"></i> 重設密碼</h2>
      </div>
      <div class="panel-body">

        <div id="reset-view-loading">
          <div class="notice-box">
            <i class="fa-solid fa-circle-info"></i>
            <div>正在確認重設密碼連結，請稍候...</div>
          </div>
        </div>

        <div id="reset-view-invalid" style="display:none;">
          <div id="reset-invalid-error" class="auth-login-error"></div>
          <p>請回到首頁重新點選「登入」→「忘記密碼？」再申請一次。</p>
          <a href="index.html" class="btn btn-primary auth-login-submit" style="text-decoration:none; display:block; box-sizing:border-box; text-align:center;">回首頁</a>
        </div>

        <div id="reset-view-form" style="display:none;">
          <div class="notice-box">
            <i class="fa-solid fa-circle-info"></i>
            <div>請設定一組新密碼（至少 6 碼）。</div>
          </div>
          <div id="reset-form-error" class="auth-login-error" style="display:none;"></div>
          <input type="password" id="reset-password" class="cell-input auth-field" placeholder="新密碼（至少 6 碼）" autocomplete="new-password">
          <input type="password" id="reset-password-confirm" class="cell-input auth-field" placeholder="再次輸入新密碼" autocomplete="new-password">
          <button type="button" id="reset-submit" class="btn btn-primary auth-login-submit">設定新密碼</button>
        </div>

        <div id="reset-view-success" style="display:none;">
          <div class="notice-box">
            <i class="fa-solid fa-circle-check"></i>
            <div>密碼已更新，你現在可以用新密碼登入了。</div>
          </div>
          <a href="index.html" class="btn btn-primary auth-login-submit" style="text-decoration:none; display:block; box-sizing:border-box; text-align:center;">回首頁</a>
        </div>

      </div>
    </div>
  </main>

  <footer class="app-footer">
    <div class="footer-container">
      <p>AnkiGen Hub &copy; 2026. 幫助你更有效率地製作 Anki 卡片。</p>
    </div>
  </footer>

  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-config.js"></script>
  <script src="reset-password.js"></script>
</body>

</html>
